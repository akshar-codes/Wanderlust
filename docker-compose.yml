services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - data
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    networks:
      - web
      - data
    environment:
      - MONGO_URL=mongodb://mongodb:27017/wanderlust?replicaSet=rs0
      - NODE_ENV=production
      - HOST=0.0.0.0
      - TRUST_PROXY_HOPS=1
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r => r.json()).then(d => process.exit(d.data?.db === 'connected' ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    networks:
      - web
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:

networks:
  web:
  data:
    internal: true
