name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build Backend Docker Image
        run: docker build --pull -t wanderlust-backend:latest ./backend
      - name: Build Frontend Assets
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
      - name: Build Frontend Docker Image
        run: docker build --pull -f frontend/Dockerfile.release -t wanderlust-frontend:latest ./frontend
      - name: Tag and Push Docker Images
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE_OWNER="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          docker tag wanderlust-backend:latest "ghcr.io/$IMAGE_OWNER/wanderlust-backend:latest"
          docker tag wanderlust-frontend:latest "ghcr.io/$IMAGE_OWNER/wanderlust-frontend:latest"
          docker push "ghcr.io/$IMAGE_OWNER/wanderlust-backend:latest"
          docker push "ghcr.io/$IMAGE_OWNER/wanderlust-frontend:latest"
