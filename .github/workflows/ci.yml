name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://localhost:27017/wanderlust_test?replicaSet=rs0
      SESSION_SECRET: dummy_secret_for_tests_32_chars_long
      MAP_TOKEN: dummy_map_token
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok"; then
              break
            fi
            sleep 2
          done
          docker exec mongodb mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for attempt in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary"
          exit 1
      - name: Cache backend modules
        uses: actions/cache@v3
        with:
          path: backend/node_modules
          key: backend-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
        working-directory: ./backend
      - name: Cache frontend modules
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: frontend-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm ci
        working-directory: ./frontend
      - run: npm install
        working-directory: ./
      - run: npm run lint
        working-directory: ./frontend
      - run: npm run test:all
        working-directory: ./backend
      - run: npm test
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend
      - run: npm run validate:api
        working-directory: ./backend
      - run: npx playwright install --with-deps
      - run: npm run e2e
        env:
          CLOUD_NAME: dummy
          CLOUD_API_KEY: dummy
          CLOUD_API_SECRET: dummy
